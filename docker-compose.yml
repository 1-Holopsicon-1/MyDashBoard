services:
  backend:
    image: ghcr.io/1-holopsicon-1/mydashboard/backend:latest
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dashboard-db:/app/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/1-holopsicon-1/mydashboard/frontend:latest
    ports:
      - "8090:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dashboard-db: