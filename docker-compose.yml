services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dashboard-db:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8090:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dashboard-db:
