name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            mkdir -p $DEPLOY_PATH

            # Create .env
            cat > $DEPLOY_PATH/.env << 'ENVEOF'
            TAILSCALE_API_KEY=${{ secrets.TAILSCALE_API_KEY }}
            TAILSCALE_TAILNET=${{ secrets.TAILSCALE_TAILNET }}
            VAULTWARDEN_URL=${{ secrets.VAULTWARDEN_URL }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            WEBAUTHN_RP_ID=${{ secrets.WEBAUTHN_RP_ID }}
            WEBAUTHN_ORIGIN=${{ secrets.WEBAUTHN_ORIGIN }}
            DB_PATH=/app/data/dashboard.db
            LISTEN_ADDR=:8081
            ENVEOF

            # Pull and restart
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker compose -f $DEPLOY_PATH/docker-compose.yml up -d --pull always
