name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - run: cd backend && go vet ./...
      - run: cd backend && go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: corepack enable
      - run: cd frontend && yarn install --immutable
      - run: cd frontend && yarn svelte-check --tsconfig ./tsconfig.json

  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            mkdir -p $DEPLOY_PATH

            # Create .env
            cat > $DEPLOY_PATH/.env << 'ENVEOF'
            TAILSCALE_API_KEY=${{ secrets.TAILSCALE_API_KEY }}
            TAILSCALE_TAILNET=${{ secrets.TAILSCALE_TAILNET }}
            VAULTWARDEN_URL=${{ secrets.VAULTWARDEN_URL }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            WEBAUTHN_RP_ID=${{ secrets.WEBAUTHN_RP_ID }}
            WEBAUTHN_ORIGIN=${{ secrets.WEBAUTHN_ORIGIN }}
            DB_PATH=/app/data/dashboard.db
            LISTEN_ADDR=:8081
            ENVEOF

            # Pull and restart
            if command -v docker-compose &>/dev/null; then
              COMPOSE="docker-compose"
            else
              COMPOSE="docker compose"
            fi
            $COMPOSE -f "$DEPLOY_PATH/docker-compose.yml" down
            $COMPOSE -f "$DEPLOY_PATH/docker-compose.yml" pull
            $COMPOSE -f "$DEPLOY_PATH/docker-compose.yml" up -d
